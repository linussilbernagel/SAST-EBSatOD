[project]
name = "sast-ebsatod"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "einops==0.6.0",
    "h5py==3.8.0",
    "hydra-core==1.3.2",
    "torchdata==0.6.0",
    "tqdm",
    "numba",
    "pytorch-lightning==1.8.6",
    "wandb==0.14.0",
    "pandas==1.5.3",
    "plotly==5.13.1",
    "opencv-python==4.6.0.66",
    "tabulate==0.9.0",
    "pycocotools==2.0.6",
    "bbox-visualizer==0.1.0",
    "StrEnum==0.4.10",
    "torch==2.0.0",
    "torchvision==0.15.0",
    "detectron2",
    "numpy==1.24.4",
    "hdf5plugin>=1.0.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu118", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu118", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
detectron2 = { git = "https://github.com/facebookresearch/detectron2.git" }


[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.extra-build-dependencies]
detectron2 = ["torch"]
